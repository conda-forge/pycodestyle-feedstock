schema_version: 1

context:
  version: "2.15.0"

package:
  name: pycodestyle
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pycodestyle/pycodestyle-${{ version }}.tar.gz
  sha256: 318f5db083869b4c4dad922d0b11124fb27ab181b6730b93371da671e31bd50e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pycodestyle = pycodestyle:_main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pycodestyle
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - pycodestyle --help

about:
  summary: Python style guide checker
  license: MIT
  license_file: LICENSE
  homepage: https://pycodestyle.pycqa.org/

extra:
  recipe-maintainers:
    - dopplershift
    - jakirkham
    - jjhelmus
    - ocefpaf
    - pmlandwehr
    - sigmavirus24
